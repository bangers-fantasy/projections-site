# Cloudflare Workers static-asset config for the public site.
#
# This is the ONLY hand-written file in site/ -- everything else here is generated by
# scripts/build_static.py and scripts/build_og.py. Do not delete it. The build sweep
# only removes stale *.html, so it survives a rebuild, and publish.sh commits it.
#
# Why Workers and not Pages: Cloudflare removed new Pages project creation from the
# dashboard. Workers static assets reached feature parity in March 2026 and is where
# they route all new projects. Existing Pages projects still work; we never had one.
#
# The two routing lines below are load-bearing:
#   html_handling      serves /lines from lines.html, matching how GitHub Pages behaves,
#                      so every link already shared keeps resolving.
#   not_found_handling without "404-page" an unmatched URL returns a bare error and the
#                      404.html we generate is ignored entirely.
name = "projections-site"
compatibility_date = "2026-08-03"

[assets]
directory = "./"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
